# Domains that require Playwright (headless Chromium) instead of httpx.
# Use this only when either:
#   a) the site is a JS-only SPA that needs an actual JS engine to
#      populate the DOM (no amount of TLS impersonation will help), OR
#   b) there's a JS challenge page that must be solved before content
#      is served.
#
# Playwright is ~10× slower than curl_cffi. When both work, keep the
# domain in ``impersonate_domains`` only.
playwright_domains:
  # jun-25 Playwright RE-TEST. Chromium WORKS now (the earlier "broken / not
  # installed" note was STALE). Tested the 38 audit JS-bucket sources through the
  # real PlaywrightFetcher: only ~7 actually rendered >=5 article links. 14 are
  # 403-bot-blocked EVEN WITH the browser (need a residential proxy — Playwright
  # can't help), and 16 render but yield 0 links (cross-host / selector — a
  # link-extraction problem, NOT a Playwright one). So this list is curated to
  # ONLY the auto-value OEM the browser genuinely rescues, keeping any Playwright
  # run bounded. (10 OEM that already work via curl_cffi live in
  # impersonate_domains; tass.ru is RSS, handled there too.)
  - www.hyundainews.com        # rendered 40 article links
  - media.renaultgroup.com     # 12
  - media.jaguar.com           # 13
  - int-media.peugeot.com      # 17
  - hongqi.ru                  # 6
  # NOT here (Playwright renders them but finds 0 links — cross-host/selector,
  # needs link-extract work, not a browser): media.vw.com, media.mercedes-benz.com,
  # media.stellantisnorthamerica.com, www.globalsuzuki.com, en.kg-mobility.com,
  # www.polestar.com, media.lamborghini.com, xpeng.com, media.lucidmotors.com.
  # Blocked even with the browser (need proxy): ir.zeekrgroup.com.

  # NOTE: these hosts returned 403 from Playwright even with stealth —
  # they combine JS challenge with IP-reputation checks (datacenter IPs
  # pre-flagged). Would need residential proxy to rescue. Listed here as
  # a rationale record, NOT active:
  #   autoblog.com, www.kia.ru, ir.tesla.com, topclassactions.com,
  #   rg.ru/tema/*, hondanews.com, infinitinews.com
